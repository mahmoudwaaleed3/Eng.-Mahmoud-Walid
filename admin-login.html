<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل دخول الأدمن</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Cairo',sans-serif;}</style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center px-4">

  <div class="w-full max-w-sm">
    <div class="flex items-center gap-2 justify-center mb-8">
      <svg viewBox="0 0 40 40" class="w-8 h-8" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 8c-4-3-9-3-14-1v22c5-2 10-2 14 1 4-3 9-3 14-1V7c-5-2-10-2-14 1z" stroke="#7C6CF6" stroke-width="2" stroke-linejoin="round"/>
        <path d="M20 8v22" stroke="#7C6CF6" stroke-width="2"/>
      </svg>
      <span class="font-bold text-lg">لوحة تحكم الأدمن</span>
    </div>

    <form id="login-form" class="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-4">
      <div>
        <label class="block text-sm font-semibold mb-1.5" for="email">الإيميل</label>
        <input id="email" type="email" required autocomplete="username"
          class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500"
          placeholder="admin@example.com">
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1.5" for="password">كلمة المرور</label>
        <input id="password" type="password" required autocomplete="current-password"
          class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500"
          placeholder="••••••••">
      </div>

      <p id="error-msg" class="text-sm text-rose-400 hidden"></p>

      <button type="submit" id="login-btn"
        class="w-full rounded-lg bg-gradient-to-l from-violet-500 to-indigo-500 py-2.5 font-bold text-sm hover:brightness-110 transition disabled:opacity-60">
        دخول
      </button>
    </form>

    <p class="text-xs text-slate-500 text-center mt-5">
      الوصول لهذه الصفحة مقصور على الأدمن فقط. لو مش أنت، من فضلك ارجع لـ
      <a href="index.html" class="text-violet-400 hover:underline">الموقع الرئيسي</a>.
    </p>
  </div>

<script>
  const SUPABASE_URL = 'https://cayfcvkqjrphbshdysnb.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_4QWsFfheXQVs6lH0-tbwDw_JYr3p1Mr';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // If already logged in, go straight to the dashboard.
  sb.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'admin-dashboard.html';
  });

  const form = document.getElementById('login-form');
  const btn = document.getElementById('login-btn');
  const errorMsg = document.getElementById('error-msg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.classList.add('hidden');
    btn.disabled = true;
    btn.textContent = 'جاري الدخول...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      errorMsg.textContent = 'الإيميل أو كلمة المرور غلط، أو الحساب ده مش مسجل كأدمن.';
      errorMsg.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'دخول';
      return;
    }

    window.location.href = 'admin-dashboard.html';
  });
</script>
</body>
</html>
